name: Publish /docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "docs-dist/**"
  workflow_dispatch:

# Project Pages cannot be enabled by API (403). The live site is the user
# site https://dssfgs.github.io/s1s2-formative-assessment/ (dssfgs.github.io).
# This job keeps /docs in this repo in sync so branch Pages also works
# if you later turn it on under Settings → Pages → Deploy from a branch.
permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy dist into docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/
          touch docs/.nojekyll
      - name: Commit /docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs already current"
          else
            git commit -m "chore: refresh GitHub Pages /docs [skip ci]"
            git push
          fi
